name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pruebas del toolkit
        run: node --test scripts/test/netlab.test.ts
      - name: Ejemplos sanos validan sin errores
        run: |
          for f in examples/*.net.json; do
            case "$f" in *broken*) continue ;; esac
            node scripts/netlab.ts validate "$f" > /dev/null || { echo "Falla: $f"; node scripts/netlab.ts validate "$f"; exit 1; }
          done
      - name: El laboratorio con fallas debe detectar errores
        run: |
          if node scripts/netlab.ts validate examples/troubleshooting-broken-lab.net.json > /dev/null; then
            echo "Se esperaban errores en el laboratorio de troubleshooting"; exit 1
          fi
